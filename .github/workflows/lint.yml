name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: ruff check app/ --select E,F,W --ignore E501,E402,W504
      - run: python -m py_compile app/*.py 2>/dev/null; echo "Lint passed (or no Python files)"
