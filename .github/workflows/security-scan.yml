name: Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC

jobs:
  secret-scan:
    name: Secret Leak Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for thorough scanning

      - name: Run git-sync dry-run (secret scanner)
        run: |
          python3 /root/scripts/git-sync.py --dry-run || {
            echo "::error::Secrets detected in commit — check the scan output above"
            exit 1
          }

      - name: Detect secrets with detect-secrets
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install detect-secrets
      - run: |
          detect-secrets scan --all-files \
            --exclude-files 'package-lock.json|pnpm-lock.yaml|poetry.lock|*.csv|*.tsv|.env.example|.env.template' \
            > .secrets.baseline.tmp 2>&1 || true
          # Fail if any real secrets found (not pre-baselined)
          detect-secrets audit .secrets.baseline.tmp 2>&1 | tee /dev/stderr | grep -q 'true' && {
            echo "::error::Unreviewed secrets found — audit required"
            exit 1
          } || true

      - name: Check for hardcoded tokens (grep fallback)
        run: |
          PATTERNS=***            'ghp_[A-Za-z0-9]\{20,\}'
            'glpat-[A-Za-z0-9_\-]\{20,\}'
            'hf_[A-Za-z0-9]\{20,\}'
            'sb_secret_[A-Za-z0-9_\-]\{20,\}'
            'cfut_[A-Za-z0-9_\-]\{20,\}'
          )
          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            if git grep -qIE "$pattern" -- '*.py' '*.js' '*.ts' '*.tsx' '*.yaml' '*.yml' '*.json' '*.toml' 2>/dev/null; then
              echo "::error::Hardcoded secret pattern found: $pattern"
              git grep -nIE "$pattern" -- '*.py' '*.js' '*.ts' '*.tsx' '*.yaml' '*.yml' 2>/dev/null
              FOUND=1
            fi
          done
          [ "$FOUND" -eq 0 ] || exit 1

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff
      - run: ruff check app/ --select E,F,W --ignore E501,E402,W503
      - run: ruff format app/ --check --diff
