[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rug-munch-intelligence-mcp"
version = "1.0.0"
description = "Rug Munch Intelligence MCP Server — 221 AI-powered crypto security tools across 13 blockchains. Scam detection, wallet forensics, whale tracking, contract auditing. The Bloomberg Terminal of Shitcoins."
readme = "README.md"
license = {text = "Proprietary — Rug Munch Media LLC"}
requires-python = ">=3.10"
authors = [
    { name = "CryptoRugMunch" },
]
keywords = ["mcp", "crypto", "rug-pull", "scam-detection", "blockchain", "intelligence", "solana", "ethereum", "base", "bsc"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
]

[project.scripts]
rug-munch-intelligence-mcp = "rug_munch_mcp.server:main"

[project.urls]
Homepage = "https://rugmunch.io"
Repository = "https://github.com/Rug-Munch-Media-LLC/rug-munch-intelligence-mcp"
Documentation = "https://github.com/Rug-Munch-Media-LLC/rug-munch-intelligence-mcp#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/rug_munch_mcp"]

[tool.ruff]
line-length = 120
target-version = "py310"